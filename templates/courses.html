<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courses - SkillMatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/courses.css">
</head>
<body>
  <nav class="navbar">
    <a href="/courses" class="logo">Skill<span>Match</span></a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="/courses" class="active">Courses</a></li>
        <li><a href="/recommendations">Recommendations</a></li>
        <li><a href="/profile">Profile</a></li>
      </ul>
      <button onclick="toggleTheme()" class="btn-theme-toggle" title="Toggle Dark / Light Mode">
        <span id="themeToggleIcon">🌙</span> <span id="themeToggleLabel">Dark</span>
      </button>
    </div>
  </nav>
  <main class="main-container">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search courses, instructors, or skill keywords...">

    <div class="category-filters category-filters-container" id="categoryFilters">
      <button type="button" class="filter-btn active" data-category="all">All Courses</button>
      <button type="button" class="filter-btn" data-category="frontend">⚡ Frontend</button>
      <button type="button" class="filter-btn" data-category="backend">⚙️ Backend</button>
      <button type="button" class="filter-btn" data-category="hacking">🛡️ Hacking / Cybersecurity</button>
      <button type="button" class="filter-btn" data-category="ai">🤖 AI & Machine Learning</button>
      <button type="button" class="filter-btn" data-category="design">🎨 UI/UX Design</button>
      <button type="button" class="filter-btn" data-category="database">🗄️ Database</button>
      <button type="button" class="filter-btn" data-category="devops">☁️ Cloud & DevOps</button>
      <button type="button" class="filter-btn" data-category="mobile">📱 Mobile Dev</button>
    </div>

    <div class="grid-layout" id="courseGrid"></div>
  </main>

  <script src="/static/main.js"></script>
</body>
</html>
