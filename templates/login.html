<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - SkillMatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <nav class="navbar">
    <a href="/courses" class="logo">Skill<span>Match</span></a>
    <button onclick="toggleTheme()" class="btn-theme-toggle" title="Toggle Dark / Light Mode">
      <span id="themeToggleIcon" class="material-symbols-outlined">dark_mode</span> <span id="themeToggleLabel">Dark</span>
    </button>
  </nav>
  <main class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">Log In</h2>
      <p class="auth-subtitle">Enter your details to view recommendations</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="glow-input password-input-padded" required>
            <button type="button" onclick="togglePasswordVisibility('password', this)" class="password-toggle-btn" title="Toggle Password Visibility"><span class="material-symbols-outlined">visibility</span></button>
          </div>
        </div>

        <button type="submit" class="btn-indigo btn-full">Log In</button>
        <div class="auth-divider">Don't have an account?</div>
        <a href="/register" class="btn-outline btn-block-link">Register New Account</a>
      </form>
    </div>

  </main>
  <script src="/static/main.js"></script>
</body>
</html>
