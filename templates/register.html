<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - SkillMatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">Skill<span>Match</span></a>
  </nav>
  <main class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Sign up to get personalized course matches</p>
      <form id="registerForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="glow-input" required style="padding-right: 2.75rem;">
            <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;" title="Toggle Password Visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-indigo" style="width: 100%;">Register</button>
        <div style="text-align: center; margin: 1.25rem 0 1rem 0; color: var(--text-muted); font-size: 0.875rem;">Already have an account?</div>
        <a href="/login" class="btn-outline" style="display: block; text-align: center; width: 100%; text-decoration: none;">Log In Here</a>
      </form>
    </div>

  </main>
  <script src="/static/main.js"></script>
</body>
</html>
