<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - SkillMatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <nav class="navbar">
    <a href="/courses" class="logo">Skill<span>Match</span></a>
    <button onclick="toggleTheme()" class="btn-theme-toggle" title="Toggle Dark / Light Mode">
      <span id="themeToggleIcon">🌙</span> <span id="themeToggleLabel">Dark</span>
    </button>
  </nav>
  <main class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Sign up to get personalized course matches</p>
      <form id="registerForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="glow-input password-input-padded" required>
            <button type="button" onclick="togglePasswordVisibility('password', this)" class="password-toggle-btn" title="Toggle Password Visibility">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number (Optional)</label>
          <input type="text" id="phone" class="glow-input" placeholder="0791234567" maxlength="10" inputmode="numeric">
        </div>
        <div class="form-row">
          <div class="form-group form-col-1">
            <label>Age</label>
            <input type="text" id="age" class="glow-input" placeholder="21" maxlength="3" inputmode="numeric">
          </div>
          <div class="form-group form-col-2">
            <label>Academic Major</label>
            <input type="text" id="major" class="glow-input" placeholder="Computer Science">
          </div>
        </div>
        <div class="form-group">
          <label>Select Your Skills & Interests</label>
          <div class="skill-chips-container" id="skillChips">
            <button type="button" class="skill-chip" data-skill="Frontend">⚡ Frontend</button>
            <button type="button" class="skill-chip" data-skill="Backend">⚙️ Backend</button>
            <button type="button" class="skill-chip" data-skill="Hacking">🛡️ Hacking / Cybersecurity</button>
            <button type="button" class="skill-chip" data-skill="AI">🤖 AI & Machine Learning</button>
            <button type="button" class="skill-chip" data-skill="Design">🎨 UI/UX Design</button>
            <button type="button" class="skill-chip" data-skill="Database">🗄️ Database Systems</button>
            <button type="button" class="skill-chip" data-skill="DevOps">☁️ Cloud & DevOps</button>
            <button type="button" class="skill-chip" data-skill="Mobile">📱 Mobile Dev</button>
          </div>
          <input type="hidden" id="skillsInput" value="">
        </div>

        <button type="submit" class="btn-indigo btn-full">Register</button>
        <div class="auth-divider">Already have an account?</div>
        <a href="/login" class="btn-outline btn-block-link">Log In Here</a>
      </form>
    </div>

  </main>
  <script src="/static/main.js"></script>
</body>
</html>
