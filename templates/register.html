<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - SkillMatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">Skill<span>Match</span></a>
    <button onclick="toggleTheme()" class="btn-outline" style="padding: 0.4rem 0.85rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; border-radius: 2rem;" title="Toggle Dark / Light Mode">
      <span id="themeToggleIcon">🌙</span> <span id="themeToggleLabel">Dark</span>
    </button>
  </nav>
  <main class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Sign up to get personalized course matches</p>
      <form id="registerForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="glow-input" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="glow-input" required style="padding-right: 2.75rem;">
            <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;" title="Toggle Password Visibility">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number (Optional)</label>
          <input type="tel" id="phone" class="glow-input" placeholder="+1 555-0199">
        </div>
        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label>Age</label>
            <input type="number" id="age" class="glow-input" min="15" max="100" placeholder="21">
          </div>
          <div class="form-group" style="flex: 2;">
            <label>Academic Major</label>
            <input type="text" id="major" class="glow-input" placeholder="Computer Science">
          </div>
        </div>
        <div class="form-group">
          <label style="margin-bottom: 0.75rem; display: block;">Select Your Skills & Interests</label>
          <div class="skill-chips-container" id="skillChips" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem;">
            <button type="button" class="skill-chip" data-skill="Frontend">⚡ Frontend</button>
            <button type="button" class="skill-chip" data-skill="Backend">⚙️ Backend</button>
            <button type="button" class="skill-chip" data-skill="Hacking">🛡️ Hacking / Cybersecurity</button>
            <button type="button" class="skill-chip" data-skill="AI">🤖 AI & Machine Learning</button>
            <button type="button" class="skill-chip" data-skill="Design">🎨 UI/UX Design</button>
            <button type="button" class="skill-chip" data-skill="Database">🗄️ Database Systems</button>
            <button type="button" class="skill-chip" data-skill="DevOps">☁️ Cloud & DevOps</button>
            <button type="button" class="skill-chip" data-skill="Mobile">📱 Mobile Dev</button>
          </div>
          <input type="hidden" id="skillsInput" value="">
        </div>



        <button type="submit" class="btn-indigo" style="width: 100%;">Register</button>
        <div style="text-align: center; margin: 1.25rem 0 1rem 0; color: var(--text-muted); font-size: 0.875rem;">Already have an account?</div>
        <a href="/login" class="btn-outline" style="display: block; text-align: center; width: 100%; text-decoration: none;">Log In Here</a>
      </form>
    </div>

  </main>
  <script src="/static/main.js"></script>
</body>
</html>
